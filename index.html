<!DOCTYPE html>
<html lang="pt-PT">
<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Painel de Frota</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
	
    <style>
		/* VARIÁVEIS DE COR */
        :root {
            --bg-principal: #0f172a; 
            --bg-painel: #1e293b; 
            --bg-cartao: #334155; 
            --texto-claro: #f8fafc;
            --texto-secundario: #cbd5e1;
            
            --cor-frota: #4ade80; 
            --cor-terceiro: #fbbf24; 
            --cor-rota: #f87171; 
            --cor-indisp: #94a3b8; 
            
            --azul-botao: #3b82f6;
            --azul-hover: #2563eb;
        }

        body {
			background-color: var(--bg-principal);
			color: var(--texto-claro);
			font-family: 'Inter', sans-serif;
			padding: 10px 15px;
            margin: 0;
            height: 100vh; 
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            box-sizing: border-box;
		}

		h1 {
			text-align: center;
			background: linear-gradient(to right, #fca311, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.6rem; 
            margin: 0 0 10px 0;
		}

        /* PAINEL DE GESTÃO */
        .painel-gestao {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            background-color: var(--bg-painel);
            padding: 10px 15px; 
            border-radius: 8px;
            align-items: center;
            flex-shrink: 0; 
        }
        .painel-gestao input, .painel-gestao select {
            padding: 6px 10px;
            border-radius: 5px;
            border: 1px solid #475569;
            background-color: var(--bg-cartao);
            color: white;
            font-size: 12px; 
            font-family: 'Inter', sans-serif;
            outline: none;
        }
        .painel-gestao input { flex: 2; }
        .painel-gestao select { flex: 1; }

        /* GRID E COLUNAS */
		.container { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 12px; 
            flex: 1; 
            min-height: 0; 
        }
		
        .coluna { 
            background-color: var(--bg-painel); 
            padding: 10px; 
            border-radius: 8px; 
            display: flex;
            flex-direction: column;
            min-height: 0; 
        }

        .titulo-coluna {
            margin: 0 0 10px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--bg-cartao);
            font-size: 0.95rem;
            flex-shrink: 0; 
        }

        /* ÁREA DE SCROLL INDIVIDUAL DAS COLUNAS */
        .conteudo-coluna {
            flex: 1;
            overflow-y: auto; 
            min-height: 0; 
            padding-right: 4px;
        }
		
        /* CARTÕES COMPACTOS */
        .cartao { 
            background-color: var(--bg-cartao); 
            padding: 8px 10px; 
            border-radius: 6px; 
            margin-bottom: 8px; 
            border-left: 4px solid gray; 
            position: relative;
        }
        .cartao:hover { background-color: #3f516b; }
		
        .disp-frota { border-left-color: var(--cor-frota); }
        .disp-terceiro { border-left-color: var(--cor-terceiro); }
		.rota { border-left-color: var(--cor-rota); }
        .indisp { border-left-color: var(--cor-indisp); opacity: 0.8; } 

        .cartao h3 { margin: 0 0 2px 0; padding-right: 55px; font-size: 0.85rem; }
        .cartao p { margin: 0 0 6px 0; color: var(--texto-secundario); font-size: 0.7rem; }

        /* ETIQUETAS */
        .tag-tipo {
            font-size: 0.5rem;
            padding: 2px 6px;
            border-radius: 10px;
            position: absolute;
            top: 10px;
            right: 10px;
            font-weight: 700;
        }
        .tag-frota { background-color: rgba(74, 222, 128, 0.15); color: var(--cor-frota); border: 1px solid var(--cor-frota); }
        .tag-terceiro { background-color: rgba(251, 191, 36, 0.15); color: var(--cor-terceiro); border: 1px solid var(--cor-terceiro); }

        /* WIDGET DE INDISPONÍVEIS */
        .painel-indisp {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 260px; 
            max-height: 40vh; 
            background-color: var(--bg-painel);
            border: 1px solid #475569;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        .painel-indisp .titulo-coluna { padding: 10px; margin: 0; font-size: 0.85rem; border-bottom: 1px solid var(--bg-cartao); }
        .painel-indisp .conteudo-coluna { padding: 8px; overflow-y: auto; }
        .painel-indisp .cartao { padding: 6px 8px; margin-bottom: 6px; }
        .painel-indisp .cartao h3 { font-size: 0.75rem; }

        /* BOTÕES */
		button {
			padding: 5px 8px; border: none; border-radius: 4px; cursor: pointer;
			font-weight: 600; font-size: 0.75rem; font-family: 'Inter', sans-serif;
			width: 100%; transition: 0.1s; margin-top: 4px;
		}
        button:active { transform: scale(0.97); } 
        button:disabled { opacity: 0.5; cursor: not-allowed; }

		.btn-enviar { background-color: rgba(248, 113, 113, 0.1); color: #fca5a5; border: 1px solid var(--cor-rota); }
        .btn-enviar:hover:not(:disabled) { background-color: var(--cor-rota); color: white; }
		.btn-chegou { background-color: rgba(74, 222, 128, 0.1); color: #86efac; border: 1px solid var(--cor-frota); }
        .btn-chegou:hover:not(:disabled) { background-color: var(--cor-frota); color: #0f172a; }
        .btn-pausar { background-color: rgba(148, 163, 184, 0.1); color: #cbd5e1; border: 1px solid #64748b; } 
        .btn-pausar:hover:not(:disabled) { background-color: #64748b; color: white; }
        .btn-adicionar { background-color: var(--azul-botao); color: white; width: auto; padding: 6px 12px; }
        .btn-finalizar { background-color: var(--cor-terceiro); color: #0f172a; width: auto; padding: 6px 12px; }
        
        .btn-remover { 
            background-color: transparent; color: #64748b; font-size: 0.65rem; 
            margin-top: 4px; padding: 2px; text-decoration: underline;
        }
        .btn-remover:hover:not(:disabled) { color: var(--cor-rota); background: transparent; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

	</style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
	<h1>Gestão de Logística (Nuvem)</h1>

    <div class="painel-gestao">
        <input type="text" id="novo-motorista" placeholder="Nome e Veículo (ex: João - HR)">
        <select id="tipo-motorista">
            <option value="frota">🏢 Frota Própria</option>
            <option value="terceiro">🚚 Freteiro</option>
        </select>
        <button class="btn-adicionar" onclick="adicionarMotorista()">➕ Cadastrar</button>
        <button class="btn-finalizar" onclick="finalizarExpediente()">🌙 Finalizar Dia</button>
    </div>
	
	<main class="container">
		<section class="coluna">
			<h2 class="titulo-coluna" style="color: var(--cor-frota);">🟢 Fila (Frota)</h2>
			<div class="conteudo-coluna" id="lista-fila-frota">A carregar dados...</div>
		</section>

        <section class="coluna">
			<h2 class="titulo-coluna" style="color: var(--cor-terceiro);">🟡 Fila (Freteiros)</h2>
			<div class="conteudo-coluna" id="lista-fila-terceiros">A carregar dados...</div>
		</section>

		<section class="coluna">
			<h2 class="titulo-coluna" style="color: var(--cor-rota);">🔴 Em Rota</h2>
			<div class="conteudo-coluna" id="lista-rota">A carregar dados...</div>
		</section>
	</main>

    <aside class="painel-indisp">
        <h2 class="titulo-coluna" style="color: var(--cor-indisp); margin:0;">⚪ Indisponível (Oficina)</h2>
        <div class="conteudo-coluna" id="lista-indisponiveis"></div>
    </aside>

	<script>
        // ==========================================
        // 2. CONFIGURAR AS CHAVES DO SUPABASE
        // ==========================================
        const supabaseUrl = 'https://yeefhdiggnacjqynzuwm.supabase.co'; 
        const supabaseKey = 'sb_publishable_fRQzEwdoKaitR9e8Z-X4jQ_881D17p4'; // Use a chave sb_publishable...
        
        // CORREÇÃO: Trocámos o nome para supabaseClient para não dar conflito!
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

		let motoristas = [];

        // 3. FUNÇÃO PARA BUSCAR DADOS NA NUVEM
        async function carregarDados() {
            let { data, error } = await supabaseClient.from('motoristas').select('*');
            
            if (error) {
                console.error("Erro ao buscar dados:", error);
                alert("Erro ao conectar à nuvem. Verifique o console para detalhes.");
                return;
            }

            if (data) {
                motoristas = data;
                atualizarTela();
            }
        }
		
		function atualizarTela() {
			let divFilaFrota = document.getElementById("lista-fila-frota");
            let divFilaTerceiros = document.getElementById("lista-fila-terceiros");
			let divRota = document.getElementById("lista-rota");
            let divIndisp = document.getElementById("lista-indisponiveis");
			
			divFilaFrota.innerHTML = "";
            divFilaTerceiros.innerHTML = "";
			divRota.innerHTML = "";
            divIndisp.innerHTML = "";

			let dispFrota = motoristas.filter(m => m.status === "disponivel" && m.tipo === "frota");
			dispFrota.sort((a, b) => a.timestamp - b.timestamp);
			dispFrota.forEach((motorista, index) => {
				let hora = motorista.timestamp ? new Date(motorista.timestamp).toLocaleTimeString("pt-PT", {hour: '2-digit', minute:'2-digit'}) : "";
				divFilaFrota.innerHTML += gerarCartaoHTML(motorista, index + 1, hora, "disp-frota");
			});

            let dispTerceiros = motoristas.filter(m => m.status === "disponivel" && m.tipo === "terceiro");
			dispTerceiros.sort((a, b) => a.timestamp - b.timestamp);
			dispTerceiros.forEach((motorista, index) => {
				let hora = motorista.timestamp ? new Date(motorista.timestamp).toLocaleTimeString("pt-PT", {hour: '2-digit', minute:'2-digit'}) : "";
				divFilaTerceiros.innerHTML += gerarCartaoHTML(motorista, index + 1, hora, "disp-terceiro");
			});

			let emRota = motoristas.filter(m => m.status == "rota");
			emRota.forEach(motorista => {
				divRota.innerHTML += gerarCartaoHTML(motorista, null, null, "rota");
			});

            let indisponiveis = motoristas.filter(m => m.status == "indisponivel");
			indisponiveis.forEach(motorista => {
				divIndisp.innerHTML += gerarCartaoHTML(motorista, null, null, "indisp");
			});
		}

        function gerarCartaoHTML(motorista, posicaoFila, hora, corBorda) {
            let titulo = posicaoFila ? `${posicaoFila}º - ${motorista.nome}` : motorista.nome;
            let infoHora = "";
            let botoes = "";

            if (motorista.status === "disponivel") {
                infoHora = `<p>Chegou: <strong>${hora}</strong></p>`;
                botoes = `
                    <div style="display: flex; gap: 5px;">
                        <button class="btn-enviar" onclick="mudarStatus(${motorista.id}, 'rota')">🚚 Rota</button>
                        <button class="btn-pausar" onclick="mudarStatus(${motorista.id}, 'indisponivel')" style="width: auto;" title="Pausar/Oficina">⚠️</button>
                    </div>
                `;
            } else if (motorista.status === "rota") {
                infoHora = `<p>Status: Fora da Loja</p>`;
                botoes = `
                    <div style="display: flex; gap: 5px;">
                        <button class="btn-chegou" onclick="mudarStatus(${motorista.id}, 'disponivel')">✅ Loja</button>
                        <button class="btn-pausar" onclick="mudarStatus(${motorista.id}, 'indisponivel')" style="width: auto;" title="Pausar/Oficina">⚠️</button>
                    </div>
                `;
            } else if (motorista.status === "indisponivel") {
                infoHora = ``; 
                botoes = `
                    <button class="btn-enviar" onclick="mudarStatus(${motorista.id}, 'rota')">🔄 Voltar p/ Rota</button>
                `;
            }
            
            let tagVisual = motorista.tipo === "frota" 
                ? `<span class="tag-tipo tag-frota">FROTA</span>`
                : `<span class="tag-tipo tag-terceiro">TERCEIRO</span>`;

            return `
                <div class="cartao ${corBorda}">
                    ${tagVisual}
                    <h3>${titulo}</h3>
                    ${infoHora}
                    ${botoes}
                    <button class="btn-remover" onclick="removerMotorista(${motorista.id})">Remover</button>
                </div>
            `;
        }

        // 4. ATUALIZAR STATUS NA NUVEM
		async function mudarStatus(idDoMotorista, novoStatus){
            let novoTimestamp = novoStatus === "disponivel" ? Date.now() : null;
			
            const { error } = await supabaseClient
                .from('motoristas')
                .update({ status: novoStatus, timestamp: novoTimestamp })
                .eq('id', idDoMotorista);

            if (!error) carregarDados(); 
		}

        // 5. INSERIR MOTORISTA NA NUVEM
        async function adicionarMotorista() {
            let input = document.getElementById("novo-motorista");
            let tipo = document.getElementById("tipo-motorista").value;
            let nome = input.value.trim();

            if (nome === "") { alert("Por favor, escreva o nome do motorista."); return; }

            const { error } = await supabaseClient
                .from('motoristas')
                .insert([{ nome: nome, status: "rota", timestamp: null, tipo: tipo }]);

            if (!error) {
                input.value = ""; 
                carregarDados();
            } else {
                console.error("Erro a inserir:", error);
            }
        }

        // 6. APAGAR MOTORISTA DA NUVEM
        async function removerMotorista(idDoMotorista) {
            if(confirm("Remover este motorista da Base de Dados?")) {
                const { error } = await supabaseClient
                    .from('motoristas')
                    .delete()
                    .eq('id', idDoMotorista);
                
                if (!error) carregarDados();
            }
        }

        // 7. FINALIZAR EXPEDIENTE NA NUVEM
        async function finalizarExpediente() {
            if(confirm("Finalizar o expediente? Todos os disponíveis voltarão para a rota.")) {
                const { error } = await supabaseClient
                    .from('motoristas')
                    .update({ status: 'rota', timestamp: null })
                    .neq('status', 'indisponivel');

                if (!error) carregarDados();
            }
        }

		// Ao abrir a página, carrega os dados
		carregarDados();
	</script>
</body>
</html>
