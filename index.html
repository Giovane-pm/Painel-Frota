<!DOCTYPE html>
<html lang="pt-PT">
<head>
	<meta charset="UTF-8">
	<title>Painel de Frota</title>
	<style>
		body {
			background-color: #1e1e24;
			color: #ffffff;
			font-family: Arial, sans-serif;
			padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
		}
		h1 {
			text-align: center;
			color: #fca311;
		}

        /* NOVO: Painel de Gestão no topo */
        .painel-gestao {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background-color: #2b2b36;
            padding: 15px;
            border-radius: 10px;
            align-items: center;
        }
        .painel-gestao input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

		.container { display: flex; gap: 20px; }
		.coluna { flex: 1; background-color: #2b2b36; padding: 20px; border-radius: 10px; }
		.cartao { background-color: #3f3f4e; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid gray; }
		
        .disp { border-left-color: #4ade80; }
		.rota { border-left-color: #f87171; }

		button {
			padding: 10px;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			font-weight: bold;
			width: 100%;
            transition: 0.2s;
		}
		.btn-enviar { background-color: #f87171; color: white; }
		.btn-chegou { background-color: #4ade80; color: #1e1e24; }
        
        /* NOVOS BOTÕES */
        .btn-adicionar { background-color: #3b82f6; color: white; width: auto; padding: 10px 20px; }
        .btn-finalizar { background-color: #eab308; color: #1e1e24; width: auto; padding: 10px 20px; }
        
        .btn-remover { 
            background-color: transparent; 
            color: #f87171; 
            border: 1px solid #f87171; 
            margin-top: 10px; 
            font-size: 12px; 
        }
        .btn-remover:hover { background-color: #f87171; color: white; }
	</style>
</head>
<body>
	<h1>Controle de Fila - Motoristas</h1>

    <!-- NOVO: Painel para Adicionar Motoristas e Finalizar o Dia -->
    <div class="painel-gestao">
        <input type="text" id="novo-motorista" placeholder="Escreva o Nome e Veículo (ex: João - HR)">
        <button class="btn-adicionar" onclick="adicionarMotorista()">➕ Adicionar Motorista</button>
        <button class="btn-finalizar" onclick="finalizarExpediente()">🌙 Finalizar Expediente</button>
    </div>
	
	<main class="container">
		<section class="coluna">
			<h2 class="titulo-coluna" style="color: #4ade80;">🟢 Disponíveis (Fila)</h2>
			<div id="lista-fila"></div>
		</section>

		<section class="coluna">
			<h2 class="titulo-coluna" style="color: #f87171;">🔴 Em Rota</h2>
			<div id="lista-rota"></div>
		</section>
	</main>

	<script>
		// 1. INICIALIZAÇÃO E MEMÓRIA
		let dadosSalvos = localStorage.getItem("frota_motoristas_v5");
		let motoristas = [];

		if (dadosSalvos) {
			motoristas = JSON.parse(dadosSalvos);
		} else {
			motoristas = [
				{ id: 1, nome: "Eurico (F4000)", status: "rota", timestamp: null },
				{ id: 2, nome: "Gerardo (HR)", status: "rota", timestamp: null },
				{ id: 3, nome: "Flavio (HR)", status: "rota", timestamp: null },
				{ id: 4, nome: "Emerson (HD)", status: "rota", timestamp: null },
				{ id: 5, nome: "Alessandro (CARGO)", status: "rota", timestamp: null },
				{ id: 6, nome: "Edipo (MOTO)", status: "rota", timestamp: null }
			];
		}

        // Função auxiliar para guardar na memória sempre que houver alterações
        function salvarDados() {
            localStorage.setItem("frota_motoristas_v5", JSON.stringify(motoristas));
        }
		
		// 2. ATUALIZAR O ECRÃ
		function atualizarTela() {
			let divFila = document.getElementById("lista-fila");
			let divRota = document.getElementById("lista-rota");
			
			divFila.innerHTML = "";
			divRota.innerHTML = "";

            // FILA
			let disponiveis = motoristas.filter(m => m.status === "disponivel");
			disponiveis.sort((a, b) => a.timestamp - b.timestamp);
            
			disponiveis.forEach(function(motorista, index) {
				let horaFormatada = new Date(motorista.timestamp).toLocaleTimeString("pt-PT");
				divFila.innerHTML += `
					<div class="cartao disp">
						<h3>${index + 1}º - ${motorista.nome}</h3>
						<p>Chegou às: <strong>${horaFormatada}</strong></p>
						<button class="btn-enviar" onclick="mudarStatus(${motorista.id}, 'rota')">Enviar para Rota</button>
                        <button class="btn-remover" onclick="removerMotorista(${motorista.id})">Remover do Sistema</button>
					</div>
				`;
			});

            // EM ROTA
			let emRota = motoristas.filter(m => m.status == "rota");
			emRota.forEach(function(motorista){
				divRota.innerHTML += `
					<div class="cartao rota">
						<h3>${motorista.nome}</h3>
						<p>Status: <strong>Fora da Loja</strong></p>
						<button class="btn-chegou" onclick="mudarStatus(${motorista.id}, 'disponivel')">Chegou na Loja</button>
                        <button class="btn-remover" onclick="removerMotorista(${motorista.id})">Remover do Sistema</button>
					</div>
				`;
			});
		}

		// 3. MUDAR STATUS
		function mudarStatus(idDoMotorista, novoStatus){
			let motorista = motoristas.find(m => m.id === idDoMotorista);
			motorista.status = novoStatus;

			if(novoStatus === "disponivel"){
				motorista.timestamp = Date.now();
			} else {
				motorista.timestamp = null;
			}
            
            salvarDados();
			atualizarTela();
		}

        // 4. ADICIONAR NOVO MOTORISTA
        function adicionarMotorista() {
            let input = document.getElementById("novo-motorista");
            let nome = input.value.trim(); // Remove espaços em branco desnecessários

            if (nome === "") {
                alert("Por favor, escreva o nome do motorista antes de adicionar.");
                return; // Para a função aqui se estiver vazio
            }

            // Descobre qual é o ID mais alto atual para criar o próximo
            let novoId = 1;
            if (motoristas.length > 0) {
                novoId = Math.max(...motoristas.map(m => m.id)) + 1;
            }

            // Adiciona à lista
            motoristas.push({
                id: novoId,
                nome: nome,
                status: "rota",
                timestamp: null
            });

            input.value = ""; // Limpa a caixa de texto
            salvarDados();
            atualizarTela();
        }

        // 5. REMOVER MOTORISTA
        function removerMotorista(idDoMotorista) {
            // Confirmação de segurança
            if(confirm("Tem a certeza que deseja remover este motorista do sistema?")) {
                // Filtra a lista, mantendo todos EXCETO o que tem este ID
                motoristas = motoristas.filter(m => m.id !== idDoMotorista);
                salvarDados();
                atualizarTela();
            }
        }

        // 6. FINALIZAR EXPEDIENTE
        function finalizarExpediente() {
            // Confirmação de segurança
            if(confirm("Deseja finalizar o expediente? Todos os motoristas voltarão para o status 'Em Rota'.")) {
                motoristas.forEach(m => {
                    m.status = "rota";
                    m.timestamp = null;
                });
                salvarDados();
                atualizarTela();
            }
        }

		// Inicia a aplicação
		atualizarTela();
	</script>
</body>
</html>
